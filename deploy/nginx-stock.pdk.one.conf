# Site stock.pdk.one trên nginx của aaPanel (web-01). Cloudflare Tunnel (CT 200) trỏ HTTP 192.168.1.20:80 vào đây.
# Chỉ dùng khi không tạo site qua giao diện aaPanel: site tạo bằng file này không hiện trong danh sách Website của aaPanel.
# Cài (cần sudo, chạy trên web-01 trong thư mục ~/apps/stock_control_plan):
#   sudo install -m 644 deploy/nginx-stock.pdk.one.conf /www/server/panel/vhost/nginx/stock.pdk.one.conf
#   sudo /www/server/nginx/sbin/nginx -t && sudo /www/server/nginx/sbin/nginx -s reload
server {
    listen 80;
    server_name stock.pdk.one;
    access_log /www/wwwlogs/stock.pdk.one.log;
    error_log  /www/wwwlogs/stock.pdk.one.error.log;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # luồng giá realtime (Server-Sent Events): không gom bộ đệm, giữ kết nối lâu
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
